<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokemon Battle</title>
    <link rel="stylesheet" href="./index.css">
</head>

<body>

<div class="container">
    <h1>Pokemon Battle</h1>

    <!-- Selection Screen -->

<div id="selection">
    <h2>Choose Your Pokémon</h2>

    <div class="selection-grid">

        <div class="poke-card" onclick="selectPokemon('Pikachu')">
            <img src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/25.png">
            <h3>Pikachu</h3>
            <p>⚡ Thunderbolt</p>
        </div>

        <div class="poke-card" onclick="selectPokemon('Charmander')">
            <img src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/4.png">
            <h3>Charmander</h3>
            <p>🔥 Flamethrower</p>
        </div>

        <div class="poke-card" onclick="selectPokemon('Bulbasaur')">
            <img src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/1.png">
            <h3>Bulbasaur</h3>
            <p>🌿 Vine Whip</p>
        </div>

        <div class="poke-card" onclick="selectPokemon('Squirtle')">
            <img src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/7.png">
            <h3>Squirtle</h3>
            <p>💧 Water Gun</p>
        </div>

    </div>
</div>

    <!-- Game Screen -->
    <div id="game" style="display:none;">

        <div class="pokemon">
            <h2 id="playerName"></h2>
            <img id="playerSprite" src="" alt="Player Pokemon">
            <div class="hp-bar">
                <div id="playerHP" class="hp-fill"></div>
            </div>
            <p id="playerStats"></p>
        </div>

        <div class="pokemon">
            <h2 id="enemyName"></h2>
            <img id="enemySprite" src="" alt="Enemy Pokemon">
            <div class="hp-bar">
                <div id="enemyHP" class="hp-fill"></div>
            </div>
            <p id="enemyStats"></p>
        </div>

        <div class="buttons">
            <button onclick="playerAction('tackle')">Tackle</button>
            <button onclick="playerAction('skill')">Skill</button>
            <button onclick="playerAction('heal')">Heal</button>
        </div>

        <div id="log"></div>
    </div>
</div>

<script src="index.js"></script>

</body>
</html>
